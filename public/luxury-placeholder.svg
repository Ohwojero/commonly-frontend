<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D24" />
      <stop offset="50%" stop-color="#10141A" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D4B2" />
      <stop offset="100%" stop-color="#C59365" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)" />

  <!-- Subtle luxury border -->
  <rect x="24" y="24" width="752" height="952" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" rx="8" />

  <!-- Monogram Logo -->
  <g transform="translate(400, 480)">
    <text 
      x="-12" 
      y="0" 
      font-family="'Playfair Display', Didot, Georgia, serif" 
      font-weight="600" 
      font-size="64" 
      fill="#FFFFFF" 
      text-anchor="middle"
      opacity="0.9"
    >C</text>
    <circle cx="20" cy="-6" r="5" fill="url(#gold)" />
  </g>

  <text 
    x="400" 
    y="540" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="600" 
    font-size="11" 
    fill="url(#gold)" 
    letter-spacing="0.25em" 
    text-anchor="middle"
    opacity="0.85"
  >PRESTIGE BEAUTY &amp; CLINICAL</text>

  <text 
    x="400" 
    y="565" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="400" 
    font-size="11" 
    fill="#8E99A8" 
    letter-spacing="0.1em" 
    text-anchor="middle"
    opacity="0.6"
  >Commonly. Curated Edit</text>
</svg>
